server {
    listen 80;
    listen [::]:80;

    error_page 404 /404/404.html;
    error_page 403 /403/403.html;

    location /api/ {
        proxy_pass http://app:1337;  # ок, если бэкенд ждёт путь с /api
    }

    location /404/ {
        alias /var/www/404/;
        internal;            # чтобы нельзя было открыть напрямую
    }
    location /403/ {
        alias /var/www/403/;
        internal;
    }

    location / {
        alias  /var/www/main/;
        index  index.html;
        try_files $uri $uri/ =404;
    }
}
