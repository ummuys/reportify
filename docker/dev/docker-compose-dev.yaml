services:

  app:
    container_name: app
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    ports:
      - 1337:1337
    env_file:
     - ../../environment/.env.dev
    depends_on:
      cache:
        condition: service_healthy
      db:
        condition: service_healthy
    
    

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8088:80"
    volumes:
      - ./../config/nginx/files/:/var/www/:rw
      - ./../config/nginx/main.conf:/etc/nginx/conf.d/default.conf:ro
    command: >
      sh -c "chgrp -R nginx /var/www && nginx -g 'daemon off;'"
    depends_on:
      - app

  cache:
    image: redis:7.2.11-alpine3.21
    container_name: cache
    volumes:
      - cache:/data
    ports:
        - "6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_USER=${REDIS_USER}
      - REDIS_USER_PASSWORD=${REDIS_USER_PASSWORD}  
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$REDIS_PASSWORD", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  db:
    image: postgres:17
    container_name: db
    environment: 
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    ports:
      - 5432:5432
    networks:
      - default
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  cache:
  pgdata: