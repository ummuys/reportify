services:

  app:
    container_name: app
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    ports:
      - 1337:1337
    env_file:
     - ../../environment/.env.dev
    depends_on:
      cache:
        condition: service_healthy
      db-report:
        condition: service_healthy
      db-userdata:
        condition: service_healthy
      migration-userdata:
        condition: service_completed_successfully

      
    
    

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8088:80"
    volumes:
      - ./../assets/nginx/files/:/var/www/:rw
      - ./../assets/nginx/main.conf:/etc/nginx/conf.d/default.conf:ro
    command: >
      sh -c "chown -R nginx:nginx /var/www && 
             chmod -R 755 /var/www && 
             nginx -g 'daemon off;'"
    depends_on:
      - app

  cache:
    image: redis:7.2.11-alpine3.21
    container_name: cache
    ports:
        - "6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_USER=${REDIS_USER}
      - REDIS_USER_PASSWORD=${REDIS_USER_PASSWORD}  
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$REDIS_PASSWORD", "ping"]
      interval: 30s
      timeout: 1s
      retries: 10

  db-report:
    image: postgres:17
    container_name: db-report
    environment: 
      POSTGRES_USER: ${PG_RP_USER}
      POSTGRES_PASSWORD: ${PG_RP_PASSWORD}
      POSTGRES_DB: ${PG_RP_DB}
    ports:
      - 5432:5432
    networks:
      - default
    volumes:
      - pg_rp_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PG_RP_USER} -d ${PG_RP_DB}" ]
      interval: 2s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  db-userdata:
    image: postgres:17
    container_name: db-userdata
    environment: 
      POSTGRES_USER: ${PG_UD_USER}
      POSTGRES_PASSWORD: ${PG_UD_PASSWORD}
      POSTGRES_DB: ${PG_UD_DB}
    ports:
      - 5433:5432
    networks:
      - default
    volumes:
      - pg_ud_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PG_UD_USER} -d ${PG_UD_DB}" ]
      interval: 2s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  migration-userdata:
    image: migrate/migrate
    container_name: migration-userdata
    environment:
     - ${DB_UD_URL}
    volumes:
      - ./../assets/db/userdata/migrations:/migrations
    command: ["-path", "/migrations", "-database", "${DB_UD_URL}", "up"]
    depends_on:
      db-userdata:
        condition: service_healthy
    restart: no
  

volumes:
  pg_rp_data:
  pg_ud_data: