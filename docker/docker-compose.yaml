services:



  app:
    container_name: app
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - 1337:1337
    env_file:
     - ../.env.test

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "8088:80"
    volumes:
      - ./config/nginx/files/:/var/www/:rw
      - ./config/nginx/main.conf:/etc/nginx/conf.d/default.conf:ro
    command: >
      sh -c "chgrp -R nginx /var/www && nginx -g 'daemon off;'"

