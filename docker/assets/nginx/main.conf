server {
    listen 80;
    listen [::]:80;

    # --- страницы ошибок ---
    error_page 404 /404/404.html;
    error_page 403 /403/403.html;

    # --- API ---
    location /api/ {
        proxy_pass http://app:1337;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";

        # CORS заголовки
        add_header 'Access-Control-Allow-Origin' "$http_origin" always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET,POST,OPTIONS,PUT,DELETE' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Disposition,Content-Length' always;
        add_header 'Vary' 'Origin' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # --- AUTH SPA в корне ---
    location / {
        root /var/www/auth;      # важно: без завершающего слэша
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /img/ {
        root /var/www;           # => /img/pgups_logo.png -> /var/www/img/pgups_logo.png
        try_files $uri =404;     # никакого /index.html
        access_log off;
    }

    # --- MENU SPA ---
    location /menu/ {
        root /var/www;           # => /var/www/menu/... = /var/www/menu/...
        index index.html;
        try_files $uri $uri/ /menu/index.html;
    }

    # --- AUTH отдельный маршрут (если нужен прямой /auth/) ---
    location /auth/ {
        root /var/www;           # => /var/www/auth/... = /var/www/auth/...
        index index.html;
        try_files $uri $uri/ /auth/index.html;
    }

    # --- Swagger ---
    location = /docs { return 301 /docs/; }

    location = /docs/ {
        proxy_pass http://app:1337/swagger/index.html;
        proxy_set_header Host $host;
    }

    location /docs/ {
        proxy_pass http://app:1337/swagger/;
        proxy_set_header Host $host;
    }

    # --- Ошибки ---
    location /404/ {
        root /var/www;
        internal;
    }

    location /403/ {
        root /var/www;
        internal;
    }
}
